      - generic [ref=f17e41]:
        - heading "What is cast on in knitting?" [level=2] [ref=f17e42]
        - paragraph [ref=f17e43]: "Casting on starts most knitting projects: it's how you create the initial row of stitches on your needle. The number of stitches you cast on, together with your gauge, determines the starting width. Too few and it's too narrow. Too many and you've wasted yarn and time. Checking this number at the start can save frogging later."
        - heading "Why gauge matters" [level=2] [ref=f17e44]
        - paragraph [ref=f17e45]: Every knitter knits differently. Even with the same yarn and needles, your tension produces a slightly different fabric than someone else's. That's why patterns list a recommended gauge, and why you need to knit a swatch in your project stitch pattern to find yours. Wash and finish it as you will the project, then measure it once dry. Count the stitches across the center over 10 cm (or 4 inches), and you have the number this calculator needs.
        - heading "How to use this calculator" [level=2] [ref=f17e46]
        - paragraph [ref=f17e47]:
          - text: "To calculate your cast on stitches, you need two things: your"
          - strong [ref=f17e48]: gauge
          - text: (how many stitches you get in 10 cm or 4 inches of knitting) and the
          - strong [ref=f17e49]: desired width
          - text: of your piece. Knit a gauge swatch first, measure it, and enter those numbers. Treat the result as a starting point and check the repeat and any extra stitches your pattern requires.
        - paragraph [ref=f17e50]: "Select cm for a width in centimeters and gauge measured over 10 cm; select inches for a width in inches and gauge measured over 4 inches. These are conventional gauge spans, not exact equivalents: 4 inches is 10.16 cm. Changing the unit does not convert your entries. The formula is gauge × width ÷ 10 in cm, or gauge × width ÷ 4 in inches."
        - paragraph [ref=f17e51]: The result is rounded to the nearest even number; a tie rounds up. For example, 99 becomes 100. A very small width can give 0 after rounding; that is not a usable cast-on count. Check your measurements and the pattern before casting on.
