      - generic [ref=e197]:
        - heading "How abbreviations read in context" [level=2] [ref=e198]
        - paragraph [ref=e199]: Most abbreviations sort themselves into a few groups, and recognizing the group helps more than memorizing individual terms.
        - paragraph [ref=e200]:
          - strong [ref=e201]: Basic stitches
          - text: are single letters.
          - code [ref=e202]: k
          - text: is knit,
          - code [ref=e203]: p
          - text: "is purl. A number after the letter tells you how many:"
          - code [ref=e204]: k5
          - text: means knit five stitches. That's the whole system for the simplest ones.
        - paragraph [ref=e205]:
          - strong [ref=e206]: Combined actions
          - text: stack letters and numbers.
          - code [ref=e207]: k2tog
          - text: means knit two stitches together.
          - code [ref=e208]: p2tog
          - text: ", same idea but purled. A lot of knitting shorthand works this way. Slow it down, read it literally."
        - paragraph [ref=e209]:
          - strong [ref=e210]: Directional markers
          - text: tell you which side of the fabric you're on.
          - code [ref=e211]: RS
          - text: is right side,
          - code [ref=e212]: WS
          - text: is wrong side. Matters because the same hand movement produces a different result depending on whether you're working the public face or the back.
        - paragraph [ref=e213]:
          - strong [ref=e214]: Shaping abbreviations
          - text: control how fabric grows or narrows.
          - code [ref=e215]: M1
          - text: ","
          - code [ref=e216]: M1L
          - text: ","
          - code [ref=e217]: M1R
          - text: ", and"
          - code [ref=e218]: kfb
          - text: add stitches.
          - code [ref=e219]: k2tog
          - text: and
          - code [ref=e220]: ssk
          - text: remove them. Knowing which ones lean left, which lean right, and which just add or subtract makes patterns easier to read at a glance.
        - paragraph [ref=e221]:
          - strong [ref=e222]: Structure terms
          - text: keep the instructions compact.
          - code [ref=e223]: rep
          - text: ","
          - code [ref=e224]: st(s)
          - text: ","
          - code [ref=e225]: beg
          - text: ","
          - code [ref=e226]: rem
          - text: ","
          - code [ref=e227]: cont
          - text: . Scaffolding, not stitches.
        - paragraph [ref=e228]:
          - text: Punctuation matters too. Asterisks and semicolons aren't decoration.
          - code [ref=e229]: "*k2, p2; rep from *"
          - text: means everything between the asterisk and the semicolon repeats. Brackets and parentheses work similarly, grouping a set of actions that get repeated a specified number of times. Missing a repeat marker is one of the fastest ways to end up with the wrong stitch count.
        - heading "US vs UK differences" [level=2] [ref=e230]
        - paragraph [ref=e231]: "A few terms shift across the Atlantic. The big ones:"
        - paragraph [ref=e232]: "US \"bind off\" is UK \"cast off.\" US \"gauge\" is UK \"tension.\" US \"stockinette\" is UK \"stocking stitch.\" And the classic trap: \"seed stitch\" and \"moss stitch\" can swap meanings depending on the source, so a written stitch definition beats the name alone every time."
        - paragraph [ref=e233]:
          - text: Most common abbreviations (
          - code [ref=e234]: k
          - text: ","
          - code [ref=e235]: p
          - text: ","
          - code [ref=e236]: yo
          - text: ","
          - code [ref=e237]: k2tog
          - text: ) are the same in both systems. If a pattern doesn't specify US or UK conventions, the stitch definitions section usually clears it up. When there's no stitch definition section at all, the designer's location is your best clue.
        - heading "Pattern-specific abbreviations" [level=2] [ref=e238]
        - paragraph [ref=e239]: This is where things get interesting, because plenty of abbreviations won't appear in any standard list. That's normal. They're custom shortcuts invented by the designer for that specific pattern, and they should be defined near the beginning of the instructions.
        - paragraph [ref=e240]:
          - text: Cable patterns are the biggest source of these. A chart key might define
          - code [ref=e241]: C4F
          - text: ","
          - code [ref=e242]: C6B
          - text: ", or something more specific to the design. The number typically tells you how many stitches cross. The letter at the end (F or B) tells you the direction: front or back, referring to where you hold the cable needle while crossing. But designers aren't always consistent with that convention. Some use L and R instead. Some number the total stitches involved, others number only the stitches that travel. The pattern's own definition is what counts."
        - paragraph [ref=e243]:
          - text: Lace patterns build compound shortcuts too. One pattern writes
          - code [ref=e244]: CDD
          - text: for a centered double decrease. Another spells the same thing out as
          - code [ref=e245]: sl2-k1-p2sso
          - text: . A third uses
          - code [ref=e246]: s2kp
          - text: . All three point at the same basic idea, but the exact execution can differ between designers, and some of these abbreviations get used for slightly different decreases depending on the source. If an abbreviation looks unfamiliar, check the pattern key before assuming it matches the most common version. Pattern keys exist for exactly this reason.
        - paragraph [ref=e247]: Colorwork patterns sometimes abbreviate color names or assignments. You might see MC (main color) and CC (contrast color), or CC1 and CC2 when multiple contrast colors are in play. Some designers use A, B, C instead. The abbreviations themselves are straightforward, but mixing up which color goes where will show in the finished fabric.
        - paragraph [ref=e248]: Some designers also create shorthand for repeated stitch sequences specific to their design. A pattern might define something like "MB" for a particular bobble method, or "cluster" for a specific combination of wraps and pulls that only applies to that project. These shortcuts save the designer from writing out a multi-step instruction every time it appears in the pattern. They only make sense inside that pattern.
        - paragraph [ref=e249]: "The general rule: if you can't find an abbreviation in a standard reference, it's almost certainly defined in the pattern header. Scroll up before searching elsewhere."
        - heading "What the symbols on knitting charts mean" [level=2] [ref=e250]
        - paragraph [ref=e251]: Charts use symbols instead of written-out rows. Each square is one stitch, and the symbol inside it tells you what to do.
        - paragraph [ref=e252]:
          - text: There's no universal chart symbol standard, but many designers stay close to Craft Yarn Council conventions. An empty square usually means knit on RS and purl on WS. A dash means purl on RS. A circle is
          - code [ref=e253]: yo
          - text: . A right-leaning slash marks
          - code [ref=e254]: k2tog
          - text: ", a left-leaning one marks"
          - code [ref=e255]: ssk
          - text: .
        - paragraph [ref=e256]: Charts read bottom to top (knitting grows upward). On flat charts, RS rows go right to left, WS rows left to right, matching the direction your needles move. Circular knitting charts read right to left on every row, since you're always working the RS.
        - paragraph [ref=e257]: If a pattern has both written and charted instructions, they should agree. When they don't (and it happens more than anyone would like), the pattern notes should say which takes priority. If they don't say, swatch a repeat before trusting either version.
        - heading "A few abbreviations worth knowing early" [level=2] [ref=e258]
        - paragraph [ref=e259]:
          - text: There's no need to memorize everything before casting on. A first scarf might only use
          - code [ref=e260]: k
          - text: and
          - code [ref=e261]: p
          - text: . A simple hat adds a decrease or two. The rest accumulates naturally with the patterns you choose, and you'll find the same dozen abbreviations cover most of what you knit.
        - paragraph [ref=e262]:
          - text: "One pair that trips people up:"
          - code [ref=e263]: ssk
          - text: and
          - code [ref=e264]: skp
          - text: are both left-leaning decreases.
          - code [ref=e265]: ssk
          - text: is the modern standard.
          - code [ref=e266]: skp
          - text: shows up more in older patterns. They're close in result but differ slightly in execution, so follow the pattern as written unless it gives permission to substitute.
        - paragraph [ref=e267]:
          - text: "Another one worth flagging:"
          - code [ref=e268]: psso
          - text: (pass slipped stitch over) shows up both on its own and as part of compound abbreviations like
          - code [ref=e269]: sl1-k2tog-psso
          - text: . When you see it standalone, it's usually following a slip instruction from the previous step.
        - paragraph [ref=e270]: The Craft Yarn Council publishes a widely used standard abbreviation list, and most designers follow it for common terms. Beyond those basics, regional habits and pattern-specific shorthand take over. "Check the pattern key" is better advice than "memorize a master list."
        - paragraph [ref=e271]:
          - text: Keep a reference open while you knit. This page is searchable, which is faster than flipping through tabs when your row is halfway worked. If you're also sorting out needle sizes or
          - link "gauge measurements" [ref=e272] [cursor=pointer]:
            - /url: /articles/how-to-measure-knitting-gauge/
          - text: ", those references pair well with this glossary. And if you're new to"
          - link "reading knitting patterns" [ref=e273] [cursor=pointer]:
            - /url: /articles/how-to-read-knitting-pattern/
          - text: ", the abbreviation key in your pattern is the first section to check before casting on."
