          - paragraph [ref=e20]: Gauge & Calculations
          - 'heading "Knitting a gauge swatch: step by step" [level=1] [ref=e21]'
          - paragraph [ref=e22]:
            - generic [ref=e23]: By KnitTools
            - generic [ref=e24]: Published May 2026
        - generic [ref=e26]:
          - paragraph [ref=e27]:
            - text: A gauge swatch is a test piece knit in your project yarn and the stitch pattern specified for gauge. Measure it over the distance and in the finishing state the pattern requests, usually 4 inches or 10 cm. This is the practical how-to. The
            - link "gauge guide" [ref=e28] [cursor=pointer]:
              - /url: /articles/how-to-measure-knitting-gauge/
            - text: explains measurement in more detail; here are the steps for making the swatch.
          - heading "What you need" [level=2] [ref=e29]
          - paragraph [ref=e30]: Your project yarn, the needles recommended by the pattern (or the yarn label if you’re not following a pattern), a ruler or stitch gauge tool, and a few pins. A small notebook or the notes app on your phone helps too. You’ll be writing down needle size, stitch count, and row count for every swatch, and trying to remember which swatch was which after they’ve dried overnight is a losing game.
          - paragraph [ref=e31]: Check which stitch pattern the gauge uses and whether the project is worked flat or in the round. Use the same needle type and knitting method for the swatch. Circular needles alone do not make a back-and-forth swatch circular; the circular shortcut below is for stockinette worked from the right side only.
          - 'heading "Step 1: cast on" [level=2] [ref=e32]'
          - paragraph [ref=e33]: "Plan about 6 inches of the stitch pattern being tested, or follow the pattern’s swatch-size instructions. The aim is a central 4-inch measurement area with spare fabric on every side, outside any border. These are planning dimensions, not guaranteed results: your actual gauge is still unknown."
          - paragraph [ref=e34]: "Quick math: 20 stitches per 4 inches × 1.5 = 30 stitches for about 6 inches of the tested fabric at the target gauge. Round fractional counts up, then adjust for full repeats and any extra stitches required by the stitch instructions. Add optional borders separately: 30 stockinette stitches plus 3 garter stitches on each side means casting on 36 stitches, not 30. The total swatch is wider than the 30-stitch stockinette section; count neither border in its gauge."
          - paragraph [ref=e35]: Use a cast-on edge that does not pull the fabric in, preferably the project’s method where practical. A ribbed project edge need not be included unless it is part of the gauge instructions.
          - 'heading "Step 2: knit the swatch" [level=2] [ref=e36]'
          - paragraph [ref=e37]: Knit in the stitch pattern specified by the gauge section. “In stockinette” means stockinette. “In pattern stitch” means the actual stitch pattern from the project. This distinction matters because different patterns produce different gauges. A cable panel pulls in. A lace pattern opens up after blocking. Ribbing compresses horizontally. Measuring a stockinette swatch and assuming it tells you the gauge of your cable yoke is a common way to end up with a sweater that doesn’t fit.
          - paragraph [ref=e38]: Work enough rows to leave an undistorted central 4-inch height away from the cast-on and bind-off edges and any borders. About 6 inches of the tested stitch pattern is a useful starting point, not a universal minimum. Complete vertical repeats where needed. If the finished swatch has too little usable fabric, make a larger one.
          - paragraph [ref=e39]: "An optional garter border can help manage stockinette curl, but it can also distort the adjoining fabric because the stitch patterns have different gauges. For a flat stockinette sample with 3 border stitches at each side: work a few garter rows first, then knit the first and last 3 stitches on every row, working the center in stockinette (knit on the right side, purl on the wrong side). Finish with a few garter rows before binding off. Keep borders and affected fabric outside the measurement area; if the center is distorted, make a larger sample or omit the border."
          - paragraph [ref=e40]: Bind off loosely. A tight bind off pulls the top edge in and distorts the rows just below it, which is exactly the area you don’t want distorted.
          - 'heading "Step 3: wash and block" [level=2] [ref=e41]'
          - paragraph [ref=e42]: Before washing or finishing, measure and record the untreated swatch using Step 4. Keep that reading for comparison with unwashed work or a pattern that explicitly specifies unblocked gauge.
          - paragraph [ref=e43]:
            - text: Then treat the swatch as you will the finished project, within the yarn’s care instructions. For a hand-washed, flat-dried project, wash the swatch accordingly, press out water gently in a towel without wringing, and dry it flat. Soaking time, water temperature and any steam treatment depend on the yarn and intended care; there is no universal 15–20-minute requirement. The
            - link "blocking guide" [ref=e44] [cursor=pointer]:
              - /url: /articles/how-to-block-knitting/
            - text: describes finishing methods.
          - paragraph [ref=e45]: "Let it dry completely, remove any pins and let the fabric relax before measuring, unless the pattern specifies another state. Do not stretch or compress it to force the target gauge. Keep the before and after readings separate: the change is evidence for this swatch, not a guarantee about every yarn of the same fiber or the garment in wear. Use the pattern’s stated measurement state; if none is given, use the finished swatch."
          - 'heading "Step 4: measure" [level=2] [ref=e46]'
          - paragraph [ref=e47]: Lay the dry swatch on a flat, firm surface. For relaxed gauge, do not stretch it; for ribbing, follow any stated relaxed or stretched measurement instruction. If the intended state is unclear, ask the designer rather than guessing.
          - paragraph [ref=e48]: "Place the ruler’s zero mark at a stitch boundary in the undistorted center, parallel to a row. Keep the entire measurement span away from all edges and borders. Count stitches over 4 inches, including partial stitches; divide by 4 for stitches per inch. Use 10 cm instead if that is the pattern’s basis. The usual 4-inch/10 cm notation is conventional: 4 inches is exactly 10.16 cm."
          - paragraph [ref=e49]: For example, a body circumference of 200 stitches in the same stitch pattern is 200 ÷ 5 = 40 inches at 5 stitches per inch, but 200 ÷ 4.5 ≈ 44.4 inches at 4.5 stitches per inch, before any seam allowance.
          - paragraph [ref=e50]: Turn the ruler vertically along a stitch column and count rows (or rounds) over the same distance, including partial rows. In stockinette, a complete V is one stitch; stacked Vs count rows. In ribbing, include the hidden purl stitches. For lace or cables, use the chart to identify stitches or measure complete repeats; a hole or crossing is not one stitch. The linked measurement guide covers these methods.
          - paragraph [ref=e51]: Record both counts and the measurement state. Check several central areas. Average only small differences in comparable readings; investigate large differences instead of averaging them into the target.
          - 'heading "Step 5: compare" [level=2] [ref=e52]'
          - paragraph [ref=e53]: Compare both counts with the pattern over the same distance, in the same stitch pattern and finishing state.
          - paragraph [ref=e54]:
            - strong [ref=e55]: "Matches:"
            - text: Check that the fabric also suits the project before casting on.
          - paragraph [ref=e56]:
            - strong [ref=e57]: "Too many stitches per 4 inches:"
            - text: The stitches are narrower. Try larger needles and swatch again.
          - paragraph [ref=e58]:
            - strong [ref=e59]: "Too few stitches:"
            - text: The stitches are wider. Try smaller needles and swatch again.
          - paragraph [ref=e60]:
            - text: A nearby needle size is a starting experiment, not a fixed correction per missing stitch. Recheck both stitch and row gauge after each change. Row gauge matters for shaping and repeats; working to a length is sufficient only where the pattern allows it. See
            - link "what to do when gauge does not match" [ref=e61] [cursor=pointer]:
              - /url: /articles/gauge-doesnt-match/
            - text: for the next decision.
          - heading "How long does this take?" [level=2] [ref=e62]
          - paragraph [ref=e63]: Allow time for knitting, finishing, complete drying and any further swatches. The time depends on the yarn, stitch pattern, swatch size and your pace; neither 45 minutes of knitting nor overnight drying is a reliable rule.
          - heading "When you can skip" [level=2] [ref=e64]
          - paragraph [ref=e65]: If you accept a different size for a simple scarf or dishcloth, you may decide to start without a separate swatch. You are also accepting uncertainty about the fabric and yarn use. For a fitted garment, hat or socks, make the swatch before committing to the project.
          - paragraph [ref=e66]: Swatch a substitute yarn too. The same yarn-weight category does not ensure the same gauge or fabric; assess the finished sample, not just the label.
          - heading "Tips for better swatches" [level=2] [ref=e67]
          - paragraph [ref=e68]: Use the same needles and knitting method as for the project. For circular work, a tube worked in the project stitch pattern is a direct option; make its circumference large enough to measure away from needle joins or folds. A flat stockinette swatch alternates knit and purl rows, which need not match your all-knit circular tension.
          - paragraph [ref=e69]:
            - text: For a shortcut that imitates
            - strong [ref=e70]: stockinette in the round
            - text: ":"
          - list [ref=e71]:
            - listitem [ref=e72]: Cast on a generous width on a circular needle and knit one row.
            - listitem [ref=e73]: Keep the right side facing you. Do not turn; slide the stitches along the cable to the other tip, ready to work them again. The working yarn is now at the left edge for the usual right-to-left knitting direction.
            - listitem [ref=e74]: Bring the yarn behind the work from left to right in a long, slack loop, then knit the next row. Leave enough slack for the swatch to lie at its full width during finishing and measuring without the loop pulling the edges together.
            - listitem [ref=e75]: Repeat the slide, loose return strand and knit row until the center is tall enough. Bind off without pulling in the edge. Record the untreated gauge, then finish and dry as above. Measure away from the loose side stitches. The strands need not be cut if they allow the swatch to lie flat without tension.
          - paragraph [ref=e76]: "This all-knit sequence is not a substitute for ribbing, garter stitch, cables or lace instructions: those require the actual round sequence. If the shortcut does not reproduce your working method or leaves no undistorted center, knit a tube instead."
          - paragraph [ref=e77]: "Label each sample before washing: yarn, needle size in mm and type, stitch pattern, flat or circular method, and before/after gauge with its measurement distance. Keep the sample for comparison. If trying several needle sizes in one strip, mark each change and leave each section large enough to measure away from the transition. Do not assume adjacent sections are distortion-free; use separate swatches if they pull on one another."
          - heading "Quick answers" [level=2] [ref=e78]
          - paragraph [ref=e79]: "Can you measure over less than 4 inches? A shorter span magnifies counting error: a half-stitch error over 2 inches becomes 1 stitch when scaled to 4 inches. Use the pattern’s measurement span where possible; a larger usable area can help with coarse yarn or long repeats."
          - paragraph [ref=e80]: Does gauge change depending on the day? Compare samples made with the same yarn, needles, method and finishing state. If the readings differ substantially, check the conditions and make another representative sample rather than averaging incompatible results.
          - paragraph [ref=e81]: Separate swatch vs measuring the project? You can check a project once it has enough undistorted fabric, but correcting an unsuitable gauge may mean ripping back. Compare untreated work with the untreated swatch. A small top-down yoke is not automatically a representative measurement area.
          - paragraph [ref=e82]: What if the pattern doesn’t give a gauge? Ask the designer if size matters. For your own simple design, start with the label’s needle recommendation and swatch in the intended stitch pattern. That gives a basis for calculating dimensions; stockinette gauge does not predict every other stitch pattern.
