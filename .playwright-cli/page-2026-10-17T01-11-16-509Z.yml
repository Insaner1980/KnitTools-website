      - generic [ref=e180]:
        - heading "How to take body measurements" [level=2] [ref=e181]
        - paragraph [ref=e182]: The measurements in these charts correspond to specific points on the body. Getting an accurate reading requires measuring in the right place.
        - paragraph [ref=e183]:
          - strong [ref=e184]: "Chest / Bust:"
          - text: Measure around the fullest part of the chest, keeping the tape level and snug but not tight. For women, this is at the fullest point of the bust. This is the primary measurement used to determine garment size.
        - paragraph [ref=e185]:
          - strong [ref=e186]: "Waist:"
          - text: Measure at the natural waistline, the narrowest point of the torso, usually just above the navel. Bending to one side helps locate it if you're unsure.
        - paragraph [ref=e187]:
          - strong [ref=e188]: "Hips:"
          - text: Measure around the widest part of the lower hip. For many bodies this sits below the natural waist, but the widest point matters more than a fixed distance. Keep the tape level.
        - paragraph [ref=e189]:
          - strong [ref=e190]: "Cross Back (shoulder to shoulder):"
          - text: Measure straight across the back from the tip of one shoulder to the other. This determines the shoulder width of a garment.
        - paragraph [ref=e191]:
          - strong [ref=e192]: "Back Waist Length:"
          - text: Measure from the prominent bone at the back of the neck straight down to the natural waist. This determines how long the torso section of a garment needs to be.
        - paragraph [ref=e193]:
          - strong [ref=e194]: "Arm Length to Underarm:"
          - text: Measure from the wrist bone to the underarm. This is your sleeve length guide.
        - paragraph [ref=e195]:
          - strong [ref=e196]: "Upper Arm:"
          - text: Measure the circumference at the fullest part of the upper arm, with the arm relaxed at the side.
        - paragraph [ref=e197]:
          - strong [ref=e198]: "Armhole Depth:"
          - text: Measure from the top of the shoulder straight down to the underarm. This determines how deep the armhole shaping needs to be.
        - paragraph [ref=e199]:
          - strong [ref=e200]: "Center Back Neck-to-Wrist:"
          - text: Measure from the center back of the neck, across the shoulder and down the arm to the wrist bone. This combined measurement is used for raglan and yoke constructions where the body and sleeve are worked together.
        - heading "Body measurements vs finished garment measurements" [level=2] [ref=e201]
        - paragraph [ref=e202]: This is the most common source of sizing confusion in knitting. These charts show body measurements, the actual dimensions of the person. A finished garment can be smaller, equal, or larger depending on the ease the designer built into the pattern.
        - paragraph [ref=e203]:
          - strong [ref=e204]: "Negative ease:"
          - text: The garment is smaller than the body. For a very close sweater fit, CYC's guidance is roughly 5-10 cm less than the actual bust or chest measurement; hats, socks, and fitted ribbing use their own project-specific grip.
        - paragraph [ref=e205]:
          - strong [ref=e206]: "Zero ease:"
          - text: The garment matches body measurements exactly. In knitted fabric this usually reads as very close fitting unless the stitch pattern is especially relaxed.
        - paragraph [ref=e207]:
          - strong [ref=e208]: "Positive ease (5–10 cm):"
          - text: The garment is slightly larger than the body. This is standard fit for most sweaters, cardigans, and tops.
        - paragraph [ref=e209]:
          - strong [ref=e210]: "Loose or oversized ease (10-15+ cm):"
          - text: The garment is noticeably larger than the body. Slouchy sweaters, cocoon cardigans, and relaxed-fit garments live here.
        - paragraph [ref=e211]: When a pattern says "to fit chest 91.5 cm" and gives a finished bust measurement of 101.5 cm, the 10 cm difference is the ease. Your job is to choose the size where the "to fit" measurement matches your body, not the finished measurement.
        - paragraph [ref=e212]:
          - text: Once you know your target size, the
          - link "Yarn Estimator" [ref=e213] [cursor=pointer]:
            - /url: /tools/yarn-estimator/
          - text: can sanity-check yardage, and the
          - link "sweater yarn guide" [ref=e214] [cursor=pointer]:
            - /url: /articles/yarn-for-sweater/
          - text: walks through sizing calculations in more depth.
        - heading "Choosing between sizes" [level=2] [ref=e215]
        - paragraph [ref=e216]: If your chest measurement falls between two sizes, the right choice depends on the garment's intended fit. For a close-fitting garment, go with the smaller size. For a relaxed or oversized fit, go with the larger size.
        - paragraph [ref=e217]: Also compare other measurements, especially hips for longer garments and upper arm for fitted sleeves. If your chest says M but your hips say L, check the pattern's schematic to see whether the hip difference matters for the garment's length and silhouette.
        - paragraph [ref=e218]:
          - text: Whichever size you pick, the
          - link "gauge swatch" [ref=e219] [cursor=pointer]:
            - /url: /articles/gauge-swatch-step-by-step/
          - text: decides whether the finished piece actually matches the pattern's numbers. The
          - link "how to measure gauge" [ref=e220] [cursor=pointer]:
            - /url: /articles/how-to-measure-knitting-gauge/
          - text: guide covers the swatching process in full.
