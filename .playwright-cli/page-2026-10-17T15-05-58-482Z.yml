          - paragraph [ref=e20]: Yarn
          - heading "How much yarn for a blanket?" [level=1] [ref=e21]
          - paragraph [ref=e22]:
            - generic [ref=e23]: By KnitTools
            - generic [ref=e24]: Updated October 2026
        - generic [ref=e26]:
          - paragraph [ref=e27]: Blankets eat yarn. Running out partway through, especially when the dye lot is no longer available, is the kind of knitting misery that better planning can often prevent.
          - paragraph [ref=e28]: Start with the finished width and length, the yarn, and the stitch pattern. The examples below are quantities from named patterns, followed by ways to estimate a different blanket.
          - heading "Yardage estimates by blanket size" [level=2] [ref=e29]
          - paragraph [ref=e30]: Baby blanket, throw and king-size are descriptions, not universal dimensions. For a bed blanket, choose the finished coverage and overhang you want; mattress dimensions alone do not specify the blanket size.
          - paragraph [ref=e31]:
            - strong [ref=e32]:
              - text: "Baby blanket example:"
              - link "Bright Cuddles Blanket, DROPS Baby 46-4" [ref=e33] [cursor=pointer]:
                - /url: https://www.garnstudio.com/pattern.php?id=11395&cid=19
              - text: .
            - text: Worked flat in lace with integrated garter borders, using one strand of DROPS Big Merino. The pattern gauge is 16 stitches and 22 rows per 10 × 10 cm in lace.
            - link "Big Merino" [ref=e34] [cursor=pointer]:
              - /url: https://www.garnstudio.com/yarn.php?show=drops-big-merino&cid=19
            - text: is an aran/worsted yarn supplied as approximately 75 m per 50 g ball.
          - table [ref=e35]:
            - rowgroup [ref=e36]:
              - row [ref=e37]:
                - columnheader "Finished size" [ref=e38]
                - columnheader "Pattern quantity / balls" [ref=e39]
                - columnheader "Supplied length" [ref=e40]
            - rowgroup [ref=e41]:
              - row [ref=e42]:
                - cell "44 × 59 cm" [ref=e43]
                - cell "300 g / 6" [ref=e44]
                - cell "450 m" [ref=e45]
              - row [ref=e46]:
                - cell "57 × 68 cm" [ref=e47]
                - cell "450 g / 9" [ref=e48]
                - cell "675 m" [ref=e49]
              - row [ref=e50]:
                - cell "69 × 77 cm" [ref=e51]
                - cell "600 g / 12" [ref=e52]
                - cell "900 m" [ref=e53]
          - paragraph [ref=e54]: Dimensions and label lengths are approximate. These are the pattern’s complete sizes, including its borders. The lengths are what the recommended whole balls supply, not measurements proving that every meter is consumed. For reference, 450 m is about 492 yards (1 yard = 0.9144 m).
          - paragraph [ref=e55]:
            - strong [ref=e56]:
              - text: "Larger blanket example:"
              - link "Strawberry Sky, DROPS 223-37" [ref=e57] [cursor=pointer]:
                - /url: https://www.garnstudio.com/pattern.php?id=10186&cid=19
              - text: .
            - text: This 100 × 140 cm blanket is worked flat from corner to corner in garter stitch, with one strand of DROPS Fabel at 20 stitches and 39 rows per 10 × 10 cm. It specifies 550 g in color 623.
            - link "Fabel" [ref=e58] [cursor=pointer]:
              - /url: https://www.garnstudio.com/yarn.php?show=drops-fabel&cid=19
            - text: "is fingering yarn with approximately 205 m per 50 g ball: 11 balls supply 2,255 m, about 2,466 yards. This is a separate pattern example, not a size extension of the lace blanket."
          - paragraph [ref=e59]:
            - text: The
            - link "Yarn Estimator" [ref=e60] [cursor=pointer]:
              - /url: /tools/yarn-estimator/
            - text: offers baby, throw, lap and bed blankets with preset sizes, plus a yarn-weight selection. It returns a rough length in meters with a yards equivalent. It does not accept your own dimensions or measured gauge, or calculate skeins, colors or stitch-pattern allowances. Check a pattern or representative swatch before using the result for shopping.
          - heading "Why yarn weight changes the total so much" [level=2] [ref=e61]
          - paragraph [ref=e62]: Yarn weight describes thickness; grams describe physical weight. Neither a category name nor a stitch count tells you the required length on its own. Compare the actual yarn, gauge and stitch pattern in your chosen blanket pattern.
          - paragraph [ref=e63]: A thicker yarn can give a different fabric with fewer stitches across the width, but that does not establish a fixed reduction in yardage or skein count. The label length and the amount needed for that fabric both matter. Compare the price of the complete required quantity, rather than assuming bulky yarn makes a cheaper blanket.
          - heading "Stitch pattern adjustments" [level=2] [ref=e64]
          - paragraph [ref=e65]: "Swatch the actual stitch pattern: cables, seed or moss stitch, garter, lace, and stranded colorwork should not all inherit a stockinette estimate. There is no reliable universal percentage to add for these patterns. Include the full repeat and, for colorwork, the floats and the amount used from each color."
          - paragraph [ref=e66]:
            - text: For an original rectangular blanket, the
            - link "area method described by Rita Buchanan" [ref=e67] [cursor=pointer]:
              - /url: https://www.datocms-assets.com/75073/1664408268-taking-the-measure.pdf
            - text: "gives a useful starting estimate: multiply the swatch’s measured yarn length or weight by"
            - strong [ref=e68]: blanket area ÷ swatch area
            - text: . Area is width × length; use matching square units, such as cm² throughout.
          - paragraph [ref=e69]: "Use the same yarn, stitch pattern and gauge. Treat the swatch as the blanket will be treated, within the yarn’s care instructions, and measure it fully dry. The measured fabric area must correspond to the yarn weighed or measured: do not include extra borders or long tails in the weight of a smaller central area. Use a large enough sample for your scale’s resolution."
          - paragraph [ref=e70]: The same area ratio can help when resizing unchanged fabric in an existing pattern. Doubling only the length doubles that fabric area; doubling both dimensions makes it four times as large. Borders, seams and fringe need their own allowance unless already included in a representative measurement. Count each part once. A pattern’s rounded purchase quantity is not measured consumption, so scaling it remains approximate.
          - heading "Converting yardage to skeins" [level=2] [ref=e71]
          - paragraph [ref=e72]: Check the yarn label for yards per skein. Divide total yardage by per-skein yardage, using the same units. Round up to whole skeins.
          - paragraph [ref=e73]:
            - text: For a hypothetical requirement of 2,200 yards and a label giving 220 yards per 100 g skein, 2,200 ÷ 220 =
            - strong [ref=e74]: 10 skeins
            - text: ", totaling 1,000 g. This illustrates the conversion; it is not a recommendation for an unspecified blanket."
          - paragraph [ref=e75]:
            - text: Plan any reserve for your project after checking what the source quantity already covers, including swatching and finishing. An eleventh skein would add 220 yards, but it is not automatically necessary or sufficient. Frogging does not consume reusable yarn a second time; allow for actual waste. Calculate and round each color separately. The
            - link "yarn estimation guide" [ref=e76] [cursor=pointer]:
              - /url: /articles/how-much-yarn-do-i-need/
            - text: covers weighing partial skeins.
          - heading "Dye lot planning" [level=2] [ref=e77]
          - paragraph [ref=e78]: Yarn dyed in different batches can look noticeably different once knit side by side, even when the skeins look identical in the store.
          - paragraph [ref=e79]: Buy all the yarn at once, from the same dye lot. Check the dye lot number on each label (it’s usually printed near the color number, sometimes labelled “Lot” or “Color Lot”). If the shop doesn’t have enough from one lot, ask whether they can order more from the same batch.
          - paragraph [ref=e80]:
            - text: If you have different dye lots, test alternating the skeins in a swatch before committing to the whole blanket. The interval depends on the pattern and yarn; alternating is not a guarantee that the difference will disappear. Even within one lot, hand-dyed skeins can vary.
            - link "Malabrigo’s Sock guidance" [ref=e81] [cursor=pointer]:
              - /url: https://malabrigoyarn.com/yarns/sock
            - text: describes both variation and working from alternating balls.
          - heading "Choosing yarn weight for a blanket" [level=2] [ref=e82]
          - paragraph [ref=e83]:
            - strong [ref=e84]: Bulky and super bulky.
            - text: Choose these when you want a chunky texture, then check the swatch’s weight and drape. Thickness alone does not guarantee warmth or a weighted-blanket effect.
          - paragraph [ref=e85]:
            - strong [ref=e86]: Worsted.
            - text: An option for both plain and textured blankets. Use the pattern gauge and a swatch to judge density and softness, rather than assuming every worsted blanket will drape alike.
          - paragraph [ref=e87]:
            - strong [ref=e88]: DK.
            - text: An option for a finer stitch texture. Check the finished fabric instead of treating the category as a guarantee of softness or suitability for a baby blanket.
          - paragraph [ref=e89]:
            - strong [ref=e90]: Sport and fingering.
            - text: Consider modular construction if you prefer handling small pieces. Some squares are sewn together; others join as you knit. Follow the construction in the pattern.
          - heading "Needles, fibers, and what actually wears well" [level=2] [ref=e91]
          - paragraph [ref=e92]: A circular needle can hold the stitches while you knit flat, back and forth. Choose a total needle length that accommodates your stitch count comfortably. The two patterns above specify 60 cm and 80 cm circular needles respectively; these are pattern-specific suggestions, not cable lengths for every blanket.
          - paragraph [ref=e93]: Choose needle size by the pattern gauge and the washed, dry fabric you want. Changing needles can change dimensions and yarn use, so swatch again rather than automatically going up one size from a sweater needle.
          - paragraph [ref=e94]: For baby blankets and any blanket likely to be washed often, start with yarns whose labels allow the care routine the blanket will actually get. Fiber names and the word superwash alone do not specify every washing and drying setting.
          - heading "FAQ" [level=2] [ref=e95]
          - paragraph [ref=e96]:
            - strong [ref=e97]: Can I use leftover yarn for a blanket?
            - text: Scrappy blankets are a useful stash project. Similar yarn thickness is a starting point, but also check gauge, fabric and compatible care instructions. For a modular blanket, measure yarn used by a complete representative square, multiply by the required number of whole squares, and allow separately for joins and borders. Count the yarn needed from each color.
          - paragraph [ref=e98]:
            - strong [ref=e99]: Is it cheaper to knit a blanket or buy one?
            - text: Compare the price of all the required balls, including each color and any planned reserve, with the price of the blanket you would buy. Large balls or cones are not automatically cheaper for your project if they leave more unused yarn.
          - paragraph [ref=e100]:
            - strong [ref=e101]: How long does it take to knit a blanket?
            - text: Time a representative section in your chosen yarn and stitch pattern to estimate your own knitting time. Include joining, borders and finishing separately; yarn category alone does not support a fixed number of hours.
          - paragraph [ref=e102]:
            - strong [ref=e103]: Should I knit a blanket flat or in the round?
            - text: Follow the pattern. Flat blankets can be knitted back and forth on circular needles. Modular designs can use separate joined pieces or joined-as-you-go sections. Other patterns start at the center and work outward in rounds; circular needles do not by themselves mean circular construction.
