          - heading "What does \"at the same time\" mean in knitting patterns?" [level=1] [ref=e21]
          - paragraph [ref=e22]:
            - generic [ref=e23]: By KnitTools
            - generic [ref=e24]: Updated October 2026
        - generic [ref=e26]:
          - paragraph [ref=e27]: “At the same time” means that two sets of instructions overlap during part of the knitting. Individual actions may fall on different rows; only some rows may need both. Keep following each instruction from its own starting point until its stated stopping point.
          - paragraph [ref=e28]:
            - text: Read the whole section for your chosen size before starting. The pattern’s notes and legend take precedence over general conventions. The
            - link "Craft Yarn Council’s pattern-reading guide" [ref=e29] [cursor=pointer]:
              - /url: https://www.craftyarncouncil.com/standards/how-to-read-knitting-pattern
            - text: explains simultaneous shaping and reversing it for a matching piece.
          - heading "A concrete example" [level=2] [ref=e30]
          - paragraph [ref=e31]: "Here is an illustrative flat-knitting exercise on 40 live stitches. Row 1 is the next row of this section, a wrong-side (WS) row; earlier rows and the cast-on are not included. The first decrease is explicitly on row 6, a right-side (RS) row:"
          - paragraph [ref=e32]: "“Continue in stockinette. On row 6, decrease 1 stitch at each end. Repeat these decreases every 6th row 4 more times: 5 decrease rows in total.”"
          - list [ref=e33]:
            - listitem [ref=e34]: "Row 1 (WS): purl across."
            - listitem [ref=e35]: "Row 2 (RS): knit across."
            - listitem [ref=e36]: "Row 3 (WS): purl across."
            - listitem [ref=e37]: "Row 4 (RS): knit across."
            - listitem [ref=e38]: "Row 5 (WS): purl across."
            - listitem [ref=e39]: "Row 6 (RS): ssk, knit to the last 2 stitches, k2tog. 38 stitches remain."
            - listitem [ref=e40]: "Row 7 (WS): purl across."
          - paragraph [ref=e41]: Continue purling odd-numbered rows and knitting even-numbered rows in this example. Repeat the decrease row on rows 12, 18, 24 and 30; the counts after those rows are 36, 34, 32 and 30. Each decrease uses 2 stitches and produces 1, so each decrease row removes 2 stitches. The total is 40 − 5 × 2 = 30 stitches. Stop decreasing after row 30 and continue as the pattern directs.
          - paragraph [ref=e42]:
            - text: There are five intervening rows between decrease rows. Five times
            - strong [ref=e43]: in total
            - text: includes row 6; five
            - strong [ref=e44]: more
            - text: "times after row 6 would mean six decrease rows, ending on row 36 with 28 stitches. An isolated phrase such as “every 6th row” does not establish the first decrease row: find that starting point in the surrounding instructions."
          - heading "Where this shows up" [level=2] [ref=e45]
          - paragraph [ref=e46]: "You may encounter overlapping armhole and neckline shaping. A pattern can start one at a row number and the other when the piece reaches a stated length. Measure from the specified point and follow any instruction about which side to finish on. A length alone does not identify a row: estimating rows needs row gauge and rounding to a suitable whole row, and does not replace checking the actual measurement. Once both schedules are running, some rows may have one decrease, both, or neither."
          - paragraph [ref=e47]: "Also appears when stitch patterns change during shaping. A sweater body might transition from ribbing to cables at the same time as waist increases. Front bands too: “Continue in seed stitch. AT THE SAME TIME, work buttonhole on rows 4, 14, 24, and 34.” The seed stitch carries on. The buttonholes slot in at intervals."
          - heading "A worked example with two overlapping schedules" [level=2] [ref=e48]
          - paragraph [ref=e49]: This separate flat example follows just one front section with 30 live stitches, with an armhole edge at the beginning of an RS row and a neck edge at its end. Row 1 starts this section on the RS; even rows are WS. On row 1, decrease 1 stitch at each edge. Repeat the armhole decrease every other row 4 more times (5 total) and the neck decrease every fourth row 2 more times (3 total). Use ssk at the beginning and k2tog at the end here; purl the WS rows.
