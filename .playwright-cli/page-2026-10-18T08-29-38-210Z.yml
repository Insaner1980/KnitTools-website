          - paragraph [ref=e113]:
            - text: The armhole decreases are on rows 1, 3, 5, 7 and 9; the neck decreases are on rows 1, 5 and 9. Both occur on rows 1, 5 and 9, not on multiples of 4. Stitch counts after rows 1–9 are
            - strong [ref=e114]: 28, 28, 27, 27, 25, 25, 24, 24, 22
            - text: ". After row 9 both schedules are complete: 30 − 5 − 3 = 22 stitches. No stitches are held or bound off in this example."
          - paragraph [ref=e115]: These are counts for one section, not a whole garment or both fronts combined. After a neckline divides a piece, record each side’s live stitches and schedule separately. Record held stitches separately from bound-off stitches; held stitches still exist. Follow the pattern for working the sides with separate yarns and for the other side’s mirrored shaping.
          - heading "Why patterns are written this way" [level=2] [ref=e116]
          - paragraph [ref=e117]: Separating a stitch pattern from its shaping schedule keeps an instruction concise, especially across several sizes. A merged row-by-row plan can still be easier to follow while knitting.
          - paragraph [ref=e118]: Think of it as two tracks playing simultaneously. Melody and bass line. Each makes sense alone. You play both.
          - heading "How to keep track" [level=2] [ref=e119]
          - paragraph [ref=e120]: Write the starting row, interval, total occurrences, edge and ending condition for each instruction. A row labelled “next row” means the next row you will work; do not count the last completed row again. Mark setup rows separately and distinguish the garment’s row count from a count restarted at a section or shaping event.
          - paragraph [ref=e121]: "For the table above, your list starts: “Row 1: knit with both decreases. Row 2: purl. Row 3: knit with the armhole decrease only.” Tick off each completed row and each shaping action. If you use two manual counters for intervals, advance both after every completed row while their schedules are active, including rows without shaping. Record completed decreases separately so you know when to stop."
          - paragraph [ref=e122]:
            - text: KnitTools’
            - link "Row Counter" [ref=e123] [cursor=pointer]:
              - /url: /
            - text: includes multiple counters as a Pro feature. For this method, you can use separate, unlinked counters that you advance yourself. You still interpret the pattern, enter the starting counts and track which actions are due; this is not a promise that the app reads the instructions or creates this merged plan automatically.
          - heading "Decrease type and symmetry" [level=2] [ref=e124]
          - paragraph [ref=e125]: When two shaping actions happen on the same row, follow the decrease types named in the pattern. If the pattern leaves the choice to you, pair the leans deliberately.
          - paragraph [ref=e126]: K2tog is a right-leaning decrease. Ssk is a left-leaning decrease. For visible shaping, use the same logic on matching edges so the shaping lines mirror each other instead of drifting in different directions.
          - paragraph [ref=e127]: When the decreases overlap, work them in the order they appear across the row. Handle the shaping at the first edge, knit across, handle the shaping at the other edge. If both shaping actions are near the same edge, do exactly what the pattern says and check the stitch count before moving on.
          - paragraph [ref=e128]: Binding off is a different operation from decreasing. In ordinary flat knitting, edge bind-offs are generally worked at the beginning of a row, so matching edges may be bound off on successive RS and WS rows. Do not replace this with decreases at both ends of one row. After turning, the beginning is the opposite physical edge. For neckline or shoulder shaping, follow the specified edge, working direction and method; “left” and “right” garment pieces refer to the wearer.
          - heading "When intervals collide" [level=2] [ref=e129]
          - paragraph [ref=e130]: "Intervals alone do not tell you where actions coincide: their first rows matter too. In the table, both start on row 1, so the 2-row and 4-row schedules coincide on rows 1, 5 and 9. Different starting rows can change or prevent that overlap."
          - paragraph [ref=e131]: Work the specified operations in the order you reach them across the row. If they are near the same edge, check which stitches each uses; do not assume you can use the same stitches twice. Keep any established stitch pattern aligned, including its edge stitches and any incomplete repeats, as the pattern directs.
          - heading "When the schedule falls on a WS row" [level=2] [ref=e132]
          - paragraph [ref=e133]:
            - text: In ordinary flat knitting without short rows, RS and WS alternate. Repeating a decrease four rows after the previous decrease keeps it on the same side, with three rows between the decreases. This depends on the first
            - strong [ref=e134]: decrease
            - text: "row, not just where you began counting. Odd rows are not universally RS: row 1 is WS in the first exercise and RS in the table."
          - paragraph [ref=e135]: If a schedule conflicts with an instruction to shape only on RS rows, check the starting point, notes and errata, or ask the designer. Do not silently move the decrease to the next RS row. For a WS decrease, use the specified method, such as p2tog or ssp. In ordinary knitting in the round the RS stays facing you, so the flat examples’ alternating knit/purl rows do not apply.
          - heading "When the actions don’t start together" [level=2] [ref=e136]
          - paragraph [ref=e137]: Sometimes armhole shaping starts first and neckline shaping starts later. The instructions overlap for only part of the work, and one may finish first. Record each actual starting row and stopping condition; do not restart the first schedule when the second begins.
          - paragraph [ref=e138]:
            - text: This is where a merged row-by-row plan pays off most. Map the armhole rows. Overlay the neck rows. Mark which rows have only armhole, which have only neck, which have both. Knit from the merged plan. If you’re also untangling the rest of the
            - link "pattern’s structure" [ref=e139] [cursor=pointer]:
              - /url: /articles/how-to-read-knitting-pattern/
            - text: ", that guide covers sizes, repeats, and abbreviations."
          - heading "Buttonholes in front bands" [level=2] [ref=e140]
          - paragraph [ref=e141]: "A common variation is: “Continue in seed stitch (or ribbing). AT THE SAME TIME, work buttonholes on rows 6, 16, 26, 36 and 46.”"
          - paragraph [ref=e142]: These numbers describe five buttonhole rows, 10 rows apart, with nine intervening rows. The earlier example, rows 4, 14, 24 and 34, describes four buttonhole rows with the same spacing. Count from the start of the band in these illustrative schedules, excluding any preceding setup row. Here row 1 is WS, so the listed even rows are RS. That is an explicit assumption for these examples, not a universal rule.
          - paragraph [ref=e143]: "These are timing examples, not complete button-band patterns: they do not specify the initial stitch count or the hole’s position across the band. For a simple yarn-over buttonhole, a yarn over adds 1 stitch and k2tog removes 1: the starting count is restored within that row. Work the other stitches in the established pattern. A buttonhole made by binding off and casting on may temporarily change the count, so track both steps on the specified rows. Follow the pattern’s buttonhole method and placement rather than treating every hole as one interchangeable action."
          - paragraph [ref=e144]: Mark the rows and completed holes on paper or in manually maintained notes. If a published pattern gives exact rows or a different counting origin, follow those instructions.
          - heading "Cross-checking with Ravelry" [level=2] [ref=e145]
          - paragraph [ref=e146]: If a section remains unclear, other knitters’ Ravelry project notes may help you identify a question to check. Compare the same size, pattern version and any modifications, and verify proposed corrections against the designer’s notes or errata. A project note is not an authoritative correction by itself.
          - heading "Common questions" [level=2] [ref=e147]
          - paragraph [ref=e148]:
            - strong [ref=e149]: Can you forget one of the actions for a few rows and recover?
            - text: Check which action was missed, on which row, and how it affects the shape and stitch pattern. An extra decrease later restores a count but does not restore its original position or the intended slope. Working back to the error is the way to reproduce the written sequence; an alternative needs to be checked for that particular pattern.
          - paragraph [ref=e150]:
            - strong [ref=e151]: Can you do the actions separately instead of together?
            - text: No. The timing is intentional. Armhole and neckline shaping overlap because the decreases need specific intervals for the correct shape. Finishing one then starting the other changes the proportions.
          - paragraph [ref=e152]:
            - strong [ref=e153]: Does this only show up in garments?
            - text: No. Accessories can combine a stitch or colour pattern with shaping too, such as a hat motif continuing while crown decreases begin. Follow round numbers if the piece is worked in the round.
          - paragraph [ref=e154]:
            - strong [ref=e155]: Why don’t patterns write every row out?
            - text: Some do, especially beginner-friendly patterns. Separating repeated instructions saves space across multiple sizes. You can write out your selected size without changing its sequence.
          - paragraph [ref=e156]:
            - strong [ref=e157]: What’s the fastest way to draft a merged row plan?
            - text: Use a row-number column and one column per action. First enter each action’s actual starting row, then its interval and total occurrences. For the table here, mark the armhole on 1, 3, 5, 7, 9 and the neck on 1, 5, 9. Include the intervening rows and stop each schedule after its specified total, even if the other continues.
