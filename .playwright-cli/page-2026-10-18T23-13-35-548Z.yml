      - generic [ref=f13e114]:
        - heading "How to take body measurements" [level=2] [ref=f13e115]
        - paragraph [ref=f13e116]: The measurements in these charts correspond to specific points on the body. Getting an accurate reading requires measuring in the right place.
        - paragraph [ref=f13e117]:
          - strong [ref=f13e118]: "Chest / Bust:"
          - text: Measure around the fullest part of the chest, keeping the tape level and snug but not tight. For women, this is at the fullest point of the bust. This is the primary measurement used to determine garment size.
        - paragraph [ref=f13e119]:
          - strong [ref=f13e120]: "Waist:"
          - text: Measure at the natural waistline, the narrowest point of the torso, usually just above the navel. Bending to one side helps locate it if you're unsure.
        - paragraph [ref=f13e121]:
          - strong [ref=f13e122]: "Hips:"
          - text: Measure around the widest part of the lower hip. For many bodies this sits below the natural waist, but the widest point matters more than a fixed distance. Keep the tape level.
        - paragraph [ref=f13e123]:
          - strong [ref=f13e124]: "Cross Back (shoulder to shoulder):"
          - text: Measure straight across the back from the tip of one shoulder to the other. This determines the shoulder width of a garment.
        - paragraph [ref=f13e125]:
          - strong [ref=f13e126]: "Back Waist Length:"
          - text: Measure from the prominent bone at the back of the neck straight down to the natural waist. This determines how long the torso section of a garment needs to be.
        - paragraph [ref=f13e127]:
          - strong [ref=f13e128]: "Back Hip Length (men):"
          - text: The men’s table uses the CYC PDF’s neck-to-hip back length, not neck-to-waist length. Check this endpoint against the pattern schematic.
        - paragraph [ref=f13e129]:
          - strong [ref=f13e130]: "Arm Length: Armpit to Wrist:"
          - text: With the arm slightly bent, measure from the armpit to the wrist. This body measurement is a guide for sleeve length, not a finished sleeve dimension.
        - paragraph [ref=f13e131]:
          - strong [ref=f13e132]: "Upper Arm:"
          - text: Measure the circumference at the fullest part of the upper arm, with the arm relaxed at the side.
        - paragraph [ref=f13e133]:
          - strong [ref=f13e134]: "Armhole Depth:"
          - text: Measure vertically from the outer top edge of the shoulder to the armpit.
        - paragraph [ref=f13e135]:
          - strong [ref=f13e136]: "Center Back Neck-to-Wrist:"
          - text: With the arm straight, measure from the base of the neck at center back, across the shoulder and along the arm to the wrist.
        - paragraph [ref=f13e137]:
          - strong [ref=f13e138]: "Accessories:"
          - text: Measure head circumference around the forehead and the whole head; foot length on the floor from the back of the heel to the longest toe; hand circumference around the dominant palm just below the knuckles, excluding the thumb. These are body measurements, not hat, sock or mitten dimensions. Foot length is not a shoe-size conversion or a complete sock measurement. Age ranges are only references.
        - heading "Body measurements vs finished garment measurements" [level=2] [ref=f13e139]
        - paragraph [ref=f13e140]: These charts show body measurements. A finished garment may be smaller, equal or larger, depending on the pattern’s intended ease.
        - paragraph [ref=f13e141]:
          - strong [ref=f13e142]: "Negative ease:"
          - text: The garment is smaller than the body. For a very close sweater fit, CYC's guidance is roughly 5-10 cm less than the actual bust or chest measurement; hats, socks, and fitted ribbing use their own project-specific grip.
        - paragraph [ref=f13e143]:
          - strong [ref=f13e144]: "Zero ease:"
          - text: The finished garment measurement equals the corresponding body measurement.
        - paragraph [ref=f13e145]:
          - strong [ref=f13e146]: "Positive ease:"
          - text: The garment is larger than the body. CYC suggests about 5–10 cm at the chest for a classic sweater fit; this is a guide, not a rule for every design.
        - paragraph [ref=f13e147]:
          - strong [ref=f13e148]: "Loose and oversized fit:"
          - text: CYC suggests about 10–15 cm of chest ease for a loose sweater and 15 cm or more for an oversized one.
        - paragraph [ref=f13e149]: For example, a pattern for a 91.5 cm body chest with a 101.5 cm finished chest has 10 cm of positive ease. Compare both the body-size guidance and the finished schematic measurements with your intended fit.
        - paragraph [ref=f13e150]:
          - text: Once you know your target size, the
          - link "Yarn Estimator" [ref=f13e151] [cursor=pointer]:
            - /url: /tools/yarn-estimator/
          - text: can sanity-check yardage, and the
          - link "sweater yarn guide" [ref=f13e152] [cursor=pointer]:
            - /url: /articles/yarn-for-sweater/
          - text: walks through sizing calculations in more depth.
        - heading "Choosing between sizes" [level=2] [ref=f13e153]
        - paragraph [ref=f13e154]: Between sizes, compare the finished measurements with your body and the ease the pattern intends. Do not automatically size down for a fitted garment or up for an oversized one. Stitch pattern, fiber and the washed, dried swatch affect stretch and drape. Hats and socks need their own pattern-specific ease; no fixed allowance guarantees fit.
        - paragraph [ref=f13e155]: Also compare other measurements, especially hips for longer garments and upper arm for fitted sleeves. If your chest says M but your hips say L, check the pattern's schematic to see whether the hip difference matters for the garment's length and silhouette.
        - paragraph [ref=f13e156]:
          - text: Whichever size you pick, the
          - link "gauge swatch" [ref=f13e157] [cursor=pointer]:
            - /url: /articles/gauge-swatch-step-by-step/
          - text: decides whether the finished piece actually matches the pattern's numbers. The
          - link "how to measure gauge" [ref=f13e158] [cursor=pointer]:
            - /url: /articles/how-to-measure-knitting-gauge/
          - text: guide covers the swatching process in full.
