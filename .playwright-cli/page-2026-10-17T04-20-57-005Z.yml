          - paragraph [ref=e20]: Gauge & Calculations
          - heading "How to measure knitting gauge" [level=1] [ref=e21]
          - paragraph [ref=e22]:
            - generic [ref=e23]: By KnitTools
            - generic [ref=e24]: Published April 2026
        - generic [ref=e26]:
          - paragraph [ref=e27]: A swatch helps you check the dimensions of a project before you commit to it. A floppy hat, an oversized sweater, or an unexpectedly long sleeve can reflect a gauge mismatch, but gauge is not the only factor in fit.
          - paragraph [ref=e28]: To measure gauge, knit a swatch about 6 inches square in the stitch specified for gauge, or use the swatch size the pattern specifies. Compare it in the state the pattern requests. If no state is given, wash and finish it as you will the project, let it dry fully, then count stitches and rows over a central 4-inch area away from the edges. Use 10 cm instead if that is the pattern’s measurement basis.
          - heading "What gauge means" [level=2] [ref=e29]
          - paragraph [ref=e30]: Gauge, called tension in many UK patterns, is the number of stitches and rows (or rounds) that fit inside a set measurement of fabric. A pattern might write it as “20 sts and 26 rows = 4 x 4 inches in stockinette stitch on US 7 (4.5 mm) needles.”
          - paragraph [ref=e31]: That line gives the designer’s measurement basis, including the stitch pattern and any stated finishing condition. With the same stitch count and stitch pattern, a gauge difference changes the dimensions. For example, 200 stitches at 20 stitches per 4 inches gives a 40-inch circumference. At 18 stitches per 4 inches, those same 200 stitches give about 44.4 inches; at 22, about 36.4 inches. Matching gauge helps with sizing, but does not guarantee fit.
          - heading "How to knit a gauge swatch" [level=2] [ref=e32]
          - paragraph [ref=e33]: The swatch is a small test fabric made with your yarn, your needles, and the stitch pattern the project actually uses. That’s the whole swatch summed up, really. But the details matter.
          - paragraph [ref=e34]: Cast on enough stitches to make a swatch about 6 inches wide, or follow the pattern’s specific swatch-size instructions. A little larger is better if the yarn is lively or the project is fitted. About 6 inches is a strong recommendation because it leaves extra material around a central 4-inch measurement area, but it isn’t a universal minimum. A smaller swatch isn’t automatically invalid if it still provides an undistorted central area large enough for the measurement. The cast-on edge, the bind-off edge, and the side stitches all behave differently from the center of the fabric, so the 4-inch area should not run edge to edge.
          - paragraph [ref=e35]: If the pattern says “in stockinette,” swatch in stockinette. If it says “in pattern stitch,” use the project stitch pattern. That part matters more than most knitters expect. Cables pull in. Lace opens up. Ribbing compresses. None of those fabrics behave like plain stockinette, and treating them as interchangeable is where gauge goes sideways. A cable-heavy fabric at the same stitch count as stockinette can come out noticeably narrower over a garment width.
          - paragraph [ref=e36]: Knit until the swatch is about 6 inches tall, leaving enough room to measure 4 inches away from the cast-on and bind-off edges. Then bind off.
          - paragraph [ref=e37]: Measure and record the unwashed swatch too, so you can compare it with unwashed work in progress or with a pattern that explicitly specifies unblocked gauge.
          - heading "Wash and block your swatch" [level=2] [ref=e38]
          - paragraph [ref=e39]: Washing and finishing can change the fabric’s dimensions. The result depends on the yarn, stitch pattern, and treatment; measuring the swatch before and after treatment lets you check the change for your own fabric.
          - paragraph [ref=e40]: Use the measurement state specified by the pattern, including unblocked gauge if requested. To assess the finished fabric, also treat the swatch as you will the project, following the yarn’s care instructions. Hand-wash and dry flat if that is how you will care for the item; use the intended machine cycle only if the yarn permits it. If the pattern gives no measurement state, use the finished swatch as your reference.
          - paragraph [ref=e41]: Let the treated swatch dry completely, remove any blocking pins, and let it relax before measuring, unless the pattern explicitly specifies a different state. Do not stretch it to force the target gauge. There is no drying time that suits every swatch. Keep the before- and after-treatment readings separate; compare unwashed work with the unwashed swatch.
          - heading "How to measure the swatch" [level=2] [ref=e42]
          - paragraph [ref=e43]: Lay the swatch flat on a firm surface without stretching or compressing it. Keep curled edges outside the measurement area. For ribbing, follow the pattern’s relaxed or stretched measurement instruction; if that is unclear, record a relaxed reading and ask the designer which state the target uses.
          - paragraph [ref=e44]: Place a ruler across an undistorted part of the center, parallel to a row. Align the zero mark, not the physical end of the ruler, with the side of a complete stitch. Read directly from above without pressing the fabric down.
          - paragraph [ref=e45]: "On the right side of stockinette, each complete V is one stitch; its two legs are not two stitches. Count horizontally to the 4-inch mark, including the fraction of a stitch at the end. For example, 21.5 stitches over 4 inches remains 21.5, not 20 or 22. If the pattern uses 10 cm, count over 10 cm: 4 inches is exactly 10.16 cm, so the two common gauge windows are not exact conversions."
          - paragraph [ref=e46]: Turn the ruler vertically, along a stitch column, to count rows over the same stated length. Each V above the next is one row in stockinette, or one round when worked in the round. Include partial rows at the endpoint too.
          - paragraph [ref=e47]: In ribbing, count both knit and purl stitches, including the purls hidden between the knit columns. In lace or cables, use the pattern or chart to identify stitches and rows; a hole or cable crossing is not one stitch or one row. If individual stitches are hard to follow, measure between equivalent points spanning complete repeats and use the known stitch or row count between those points. If the pattern gives a finished repeat size, compare with that size directly.
          - paragraph [ref=e48]: "Repeat the measurement in a few undistorted central areas. For readings over the same length and in the same state, a small variation can be averaged: (21 + 21.5 + 22) ÷ 3 = 21.5 stitches per 4 inches. These three readings are an example, not a required number of measurements. Investigate large differences rather than averaging them away to match the pattern."
          - paragraph [ref=e49]: If you measure the length of a fixed stitch count instead, calculate count ÷ measured length × target length, keeping the length units the same. For example, 30 stitches spanning 5.6 inches gives 30 ÷ 5.6 × 4 ≈ 21.43 stitches per 4 inches. Record the original count and length; do not round the result to make it match 20. Use the same method for rows.
          - paragraph [ref=e50]: Record the yarn, needles, stitch pattern, flat or circular method, treatment, relaxed or stretched state, measurement length, and stitch and row counts. Compare like with like. A gauge window is optional; a plain ruler works.
          - heading "When your gauge doesn’t match" [level=2] [ref=e51]
          - paragraph [ref=e52]: It often won’t match on the first try. That’s normal. Tension is personal, and two knitters can use the same yarn and the same needle and still get different fabric.
          - paragraph [ref=e53]:
            - strong [ref=e54]: Too many stitches per inch.
            - text: Your fabric is tighter than the designer’s. Go up a needle size and swatch again. If you need to check what the next size up looks like in a different system, the
            - link "needle size conversion chart" [ref=e55] [cursor=pointer]:
              - /url: /tools/needle-size-chart/
            - text: is the fast reference.
          - paragraph [ref=e56]:
            - strong [ref=e57]: Too few stitches per inch.
            - text: Your fabric is looser. Go down a needle size and swatch again.
          - paragraph [ref=e58]: Sometimes one needle-size change is enough; sometimes more swatching is needed. If stitch and row gauge do not both match, check the construction before prioritizing one. In conventionally oriented knitting, stitch gauge controls width and row gauge controls length; sideways construction can reverse those roles. Working to a measured length can help in a plain section, but it does not fix row-based shaping, sleeve caps, yokes, or pattern-repeat placement.
          - paragraph [ref=e59]:
            - text: If you want to understand
            - link "why gauge varies between knitters" [ref=e60] [cursor=pointer]:
              - /url: /articles/what-is-gauge-in-knitting/
            - text: and why it drifts mid-project, that’s a deeper topic. Don’t let multiple swatches feel like failure. Experienced knitters expect them. Some knitters reliably run tight, others reliably run loose, and knowing your tendency is useful. But it never replaces the swatch because yarn fiber, needle material, and stitch pattern all push the fabric around in their own ways.
          - heading "Gauge over pattern stitch vs stockinette" [level=2] [ref=e61]
          - paragraph [ref=e62]: Patterns usually tell you which stitch the gauge was measured in. Worth paying attention to that line.
          - paragraph [ref=e63]: Stockinette gauge is the common baseline. If the pattern says “in stockinette,” use stockinette for the swatch even if the project includes cables elsewhere.
          - paragraph [ref=e64]: If the pattern says “in pattern stitch,” swatch the actual pattern stitch. This matters most in allover texture, cable-heavy fabrics, lace, and anything where the stitch pattern is the fabric rather than decoration sitting on top of it.
          - paragraph [ref=e65]: Some patterns give both stockinette gauge and pattern-stitch gauge. Check each for the sections where the pattern uses it; one result does not establish the other.
          - heading "Gauge in the round vs flat" [level=2] [ref=e66]
          - paragraph [ref=e67]: Flat knitting and knitting in the round can produce different gauges even with the same yarn and needle size. Many knitters purl at a different tension than they knit, so flat stockinette and circular stockinette aren’t always interchangeable.
          - paragraph [ref=e68]: If the project is worked in the round, swatch in the round in the specified stitch pattern. Use the same needle setup where practical, and make the tube large enough for an undistorted central measurement area when laid flat, away from its folds. Stockinette in the round uses knit stitches every round; that instruction does not apply to every stitch pattern.
          - heading "How gauge connects to project planning" [level=2] [ref=e69]
          - paragraph [ref=e70]:
            - text: Once gauge is known, the rest of the planning gets easier. KnitTools’
            - link "Cast On Calculator" [ref=e71] [cursor=pointer]:
              - /url: /tools/cast-on-calculator/
            - text: uses it to calculate stitch counts for a target width. The
            - link "Yarn Estimator" [ref=e72] [cursor=pointer]:
              - /url: /tools/yarn-estimator/
            - text: uses project type, size, and yarn weight for a yardage estimate, so treat it as a planning check alongside your gauge and pattern details. For a
            - link "step-by-step swatch walkthrough" [ref=e73] [cursor=pointer]:
              - /url: /articles/gauge-swatch-step-by-step/
            - text: ", that’s a separate page."
          - paragraph [ref=e74]: That chain matters. Gauge drives stitch count. Stitch count drives dimensions. Dimensions drive yardage. If the first number is off, everything downstream drifts with it.
          - heading "FAQ" [level=2] [ref=e75]
          - paragraph [ref=e76]:
            - strong [ref=e77]: Can I just measure a few stitches instead of a full swatch?
            - text: A small area amplifies counting errors. Use the pattern’s full measurement length, commonly 4 inches or 10 cm, away from distorted edges. If the pattern specifies a repeat or panel size, use that basis instead.
          - paragraph [ref=e78]:
            - strong [ref=e79]: How many swatches should I knit?
            - text: Knit another swatch when you change needles, yarn, or technique to correct gauge. There is no universal number of swatches or acceptable discrepancy. Judge the dimensions and fabric required by your project; a scarf or blanket can also need a specific size.
          - paragraph [ref=e80]:
            - strong [ref=e81]: Does yarn weight affect how much gauge matters?
            - text: The effect depends on the target gauge and the size being made, not the yarn category alone. For the same intended width, a given stitch-count discrepancy per 4 inches is proportionally larger at a lower target gauge. Check your measured gauge at every yarn weight.
          - paragraph [ref=e82]:
            - strong [ref=e83]: My gauge matches after blocking but not before. Which one counts?
            - text: Use the gauge condition specified by the pattern, including unblocked gauge when that is what it calls for. If it does not specify one, use the gauge after washing or blocking the swatch as you will treat the finished project, and record both the before- and after-blocking measurements.
          - paragraph [ref=e84]:
            - strong [ref=e85]: Do I need to keep my swatches?
            - text: Keeping them is useful, especially for sweaters or anything where you might need to re-check gauge mid-project. Some knitters label them with the needle size and yarn. Some unravel them once the project is safely underway. Either works, as long as the swatch has already done its job.
